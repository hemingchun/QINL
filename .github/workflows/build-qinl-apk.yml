name: Build QinL Mirror Performance APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trigger.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout QINL build repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 37 and NDK
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Download official DiPlay 0.2.13
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 -o /tmp/diplay-src.zip https://github.com/shihabal3amri/DiPlay/archive/refs/tags/v0.2.13.zip
          curl -L --fail --retry 3 -o /tmp/diplay.apk https://github.com/shihabal3amri/DiPlay/releases/download/v0.2.13/DiPlay-0.2.13.apk
          unzip -q /tmp/diplay-src.zip -d /tmp
          mv /tmp/DiPlay-0.2.13 "$GITHUB_WORKSPACE/DiPlay"

      - name: Apply Qin L mirror-performance patch
        shell: bash
        run: |
          set -euxo pipefail
          base64 -d qinl_mirror_perf.patch.gz.b64 | gunzip > /tmp/qinl.patch
          cd "$GITHUB_WORKSPACE/DiPlay"
          patch -p2 < /tmp/qinl.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile/build.gradle.kts')
          s = p.read_text()
          perf = '        create("perf") {\n            initWith(getByName("release"))\n            applicationIdSuffix = ".mirrorperf"\n            versionNameSuffix = "-qinl-mirror-perf"\n            signingConfig = signingConfigs.getByName("debug")\n        }\n'
          s = s.replace(perf, '')
          perf_task = 'tasks.register("assembleStandalonePerf") {\n    group = "build"\n    description = "Build the non-debuggable Qin L mirror performance APK with explicit authentication."\n    dependsOn(verifyStandaloneAuthentication, "assemblePerf")\n}\n'
          s = s.replace(perf_task, '')
          s = s.replace('        release {\n', '        release {\n            applicationIdSuffix = ".mirrorperf"\n            versionNameSuffix = "-qinl-mirror-perf"\n', 1)
          s = s.replace('            signingConfig = signingConfigs.getByName("release")', '            signingConfig = signingConfigs.getByName("debug")', 1)
          s = s.replace('targetSdk = 37', 'targetSdk = 36')
          p.write_text(s)
          p = Path('common/build.gradle.kts')
          s = p.read_text().replace('targetSdk = 37', 'targetSdk = 36')
          p.write_text(s)
          p = Path('shared/build.gradle')
          s = p.read_text().replace('targetSdk = 37', 'targetSdk = 36')
          p.write_text(s)
          PY

      - name: Provision official CarPlay authentication assets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/auth/offline-mfi"
          unzip -p /tmp/diplay.apk assets/offline-mfi/identity.pk8 > "$GITHUB_WORKSPACE/auth/offline-mfi/identity.pk8"
          unzip -p /tmp/diplay.apk assets/offline-mfi/certificate.p7b > "$GITHUB_WORKSPACE/auth/offline-mfi/certificate.p7b"
          test -s "$GITHUB_WORKSPACE/auth/offline-mfi/identity.pk8"
          test -s "$GITHUB_WORKSPACE/auth/offline-mfi/certificate.p7b"

      - name: Build APK
        shell: bash
        env:
          DIPLAY_AUTH_ASSETS_DIR: ${{ github.workspace }}/auth
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/DiPlay"
          chmod +x gradlew
          ./gradlew :mobile:verifyStandaloneAuthentication :mobile:assembleRelease --stacktrace --no-daemon
          find mobile/build/outputs/apk -type f -name '*.apk' -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-QinL-MirrorPerf
          path: DiPlay/mobile/build/outputs/apk/**/*.apk
          if-no-files-found: error
